<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="alert-message" class="alert-banner hidden"></div>

<section id="login-section" class="login-container">
    <div class="login-card">
        <h2>Student Portal Login</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="login-id">Student ID or Email</label>
                <input type="text" id="login-id" placeholder="20190016950" required>
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-save" style="width: 100%;">Login</button>
        </form>
    </div>
</section>

<div id="app-wrapper" class="hidden">

    <div id="drawer-overlay" class="drawer-overlay hidden"></div>
    <aside id="sidebar-drawer" class="sidebar-drawer hidden">
        <div class="drawer-header">
            <h3>Menu</h3>
            <button id="btn-close-drawer" class="close-drawer-btn" type="button">&times;</button>
        </div>
        <ul class="drawer-menu">
            <li><a href="javascript:void(0)" onclick="navigateToProfile()" class="drawer-link active">Profile</a></li>
            <li><a href="about.html" class="drawer-link">About</a></li>
            <li><a href="skills.html" class="drawer-link">Skills</a></li>
            <li><a href="projects.html" class="drawer-link">Projects</a></li>
            <li><a href="contact.html" class="drawer-link">Contact</a></li>
            <li><button id="btn-logout" class="drawer-link btn-danger-link" type="button">Log Out</button></li>
        </ul>
    </aside>

    <div class="header-bar">
        <button id="btn-menu" class="icon-btn" type="button">☰</button>
        <h1 id="page-title">Student Profile</h1>
        <button id="btn-toggle-edit" class="btn-top-edit" type="button">Edit Profile</button>
    </div>

    <main class="container">

        <section id="view-profile-card" class="profile-card">
            <div class="profile-header-flex">
                <div class="avatar-container" id="avatar-container" title="Tap to change photo">
                    <img id="profile-image" src="img/pfp.png" alt="Profile Picture">
                </div>

                <div class="profile-header-info">
                    <h2 id="display-name">Loading...</h2>
                    <p id="display-course" class="sub-text">...</p>
                    <p id="display-year" class="sub-text">...</p>
                </div>
            </div>

            <div class="profile-field-group">
                <label>FULL NAME</label>
                <p id="field-name">-</p>

                <label>COURSE</label>
                <p id="field-course">-</p>

                <label>YEAR LEVEL</label>
                <p id="field-year">-</p>

                <label>ABOUT ME</label>
                <p id="field-bio">-</p>

                <label>SKILLS</label>
                <p id="field-skills">-</p>
            </div>
        </section>

        <section id="edit-profile-card" class="profile-card hidden">
            <h2>Edit Profile</h2>
            <form id="edit-profile-form">
                <div class="form-group">
                    <label for="edit-name">FULL NAME</label>
                    <input type="text" id="edit-name" required>
                </div>
                <div class="form-group">
                    <label for="edit-course">COURSE</label>
                    <input type="text" id="edit-course" required>
                </div>
                <div class="form-group">
                    <label for="edit-year">YEAR LEVEL</label>
                    <input type="text" id="edit-year" required>
                </div>
                <div class="form-group">
                    <label for="edit-bio">ABOUT ME</label>
                    <textarea id="edit-bio" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-skills">SKILLS</label>
                    <input type="text" id="edit-skills">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-save">Save Changes</button>
                    <button type="button" id="btn-cancel-edit" class="btn btn-cancel">Cancel</button>
                </div>
            </form>
        </section>

    </main>


    <input type="file" id="browser-file-input" accept="image/*" style="display: none;">

    <div id="photo-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Choose Profile Picture</h3>
            <button id="btn-take-photo" class="modal-btn" type="button">Take Photo</button>
            <button id="btn-choose-photo" class="modal-btn" type="button">Choose Photo</button>
            <button id="btn-close-modal" class="modal-btn btn-close" type="button">Cancel</button>
        </div>
    </div>

</div>

<script src="cordova.js" onerror="console.log('No cordova.js found, running browser mode')"></script>
<script src="js/index.js"></script>
</body>
</html>
